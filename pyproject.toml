[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liquid-foam-interface-volume-detector"
version = "1.0.0"
description = "Computer-vision reading of graduated-cylinder scales and liquid/foam interface levels, with a full uncertainty budget."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Camille Duparc" }]
dependencies = [
  "opencv-python>=4.8",
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["cylvision*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
